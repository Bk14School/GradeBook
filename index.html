<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบบันทึกคะแนน - โรงเรียนบ้านคลอง 14</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root { --primary: #6366f1; --primary-dark: #4338ca; --primary-light: #e0e7ff; --secondary: #64748b; --success: #10b981; --danger: #ef4444; --bg: #f8fafc; }
  body { font-family: 'Prompt', sans-serif; background: var(--bg); }
  .app-nav { background: #fff; padding: 10px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .page-section { display: none; } .page-section.active { display: block; }
  .app-card { background: #fff; border-radius: 20px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
  .grade-table { width: 100%; border-collapse: collapse; }
  .grade-table th, .grade-table td { border: 1px solid #ddd; padding: 8px; text-align: center; }
  .score-input { width: 60px; text-align: center; }
</style>
</head>
<body>
<div class="app-nav">
  <div class="container d-flex justify-content-between align-items-center">
    <div class="brand fw-bold">G+ ระบบบันทึกคะแนน</div>
    <div class="nav-info">
      <div id="teacherBadge" class="badge bg-primary-subtle text-primary p-2"></div>
      <button class="btn btn-sm btn-outline-secondary" id="btnNavAdmin" onclick="showPage('adminPage')" style="display:none;">⚙️ จัดการครู</button>
      <button class="btn btn-sm btn-outline-primary" id="btnNavGrade" onclick="showPage('gradePage')" style="display:none;">📝 คะแนน</button>
      <button class="btn btn-sm btn-outline-danger" id="btnLogout" onclick="logout()" style="display:none;">ออก</button>
    </div>
  </div>
</div>

<div class="container mt-4">
  <div id="loginPage" class="page-section active">
    <div class="app-card text-center shadow-sm">
      <h3>เข้าสู่ระบบ</h3>
      <div id="pinDisplay" class="my-3">...</div>
      <div class="d-grid gap-2" style="max-width: 200px; margin: 0 auto;">
        <button class="btn btn-outline-dark" onclick="addPin('1')">1</button>
        <button class="btn btn-outline-dark" onclick="doLogin()">Login</button>
      </div>
    </div>
  </div>

  <div id="adminPage" class="page-section">
    <div class="app-card">
      <button class="btn btn-primary" onclick="adminSetupYear()">สร้างฐานข้อมูลคะแนน ปี 2568</button>
      <table class="table mt-3" id="teacherTable">
        <thead><tr><th>ชื่อครู</th><th>ชั้น</th><th>วิชา (ติ๊กเลือก)</th><th>บันทึก</th></tr></thead>
        <tbody id="teacherTbody"></tbody>
      </table>
    </div>
  </div>

  <div id="gradePage" class="page-section">
    <div class="app-card">
      <select id="gradeClassroom" class="form-select mb-2" onchange="updateSubjectDropdown()"></select>
      <select id="gradeSubject" class="form-select mb-2"></select>
      <button class="btn btn-success" onclick="loadGrades()">โหลดรายชื่อ</button>
      <table class="grade-table mt-3"><tbody id="gradeTbody"></tbody></table>
      <button class="btn btn-primary mt-2" onclick="saveGrades()">บันทึกคะแนน</button>
    </div>
  </div>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx_-Q4T2dJUX6L7c3EEB-ODEtsxb0Plsu6RA_J8WBh_DTIPcV4-JCn-A0aLBXC6ARvN/exec";
let currentUser = null; let currentPin = ""; let loadedGradeData = [];

function showPage(page) {
  document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
  document.getElementById(page).classList.add('active');
  if (page === 'adminPage') loadTeacherTable();
}

async function api(action, data={}) {
  const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action, data }) });
  const json = await res.json();
  return json.data;
}

function addPin(num) { currentPin += num; if(currentPin.length === 4) doLogin(); }
async function doLogin() {
  currentUser = await api('login', { password: currentPin });
  document.getElementById('teacherBadge').textContent = currentUser.name;
  document.getElementById('teacherBadge').style.display = 'block';
  document.getElementById('btnNavGrade').style.display = 'inline-block';
  document.getElementById('btnLogout').style.display = 'inline-block';
  if(currentUser.isAdmin) document.getElementById('btnNavAdmin').style.display = 'inline-block';
  showPage(currentUser.isAdmin ? 'adminPage' : 'gradePage');
}

async function loadTeacherTable() {
  const teachers = await api('getTeacherList');
  const allSubj = await api('getAllSubjects');
  document.getElementById('teacherTbody').innerHTML = teachers.map(t => `
    <tr><td>${t[1]}</td><td>${t[3]}</td>
    <td>${(allSubj[t[3]]||[]).map(s=>`<input type="checkbox" value="${s}" class="sub-${t[0]}"> ${s}`).join('<br>')}</td>
    <td><button class="btn btn-sm btn-primary" onclick="saveTeacher('${t[0]}','${t[1]}','${t[3]}')">บันทึก</button></td></tr>
  `).join('');
}

async function saveTeacher(id, name, cls) {
  const selected = [];
  document.querySelectorAll(`.sub-${id}:checked`).forEach(c => selected.push(c.value));
  await api('saveTeacherAssignments', { teacherId: id, teacherName: name, classroom: cls, subjects: selected.join(',') });
  alert('บันทึกสำเร็จ');
}

async function updateSubjectDropdown() {
  const sel = document.getElementById('gradeSubject');
  const subjects = currentUser.isAdmin ? await api('getSubjects', { classroom: document.getElementById('gradeClassroom').value }) : currentUser.mySubjects;
  sel.innerHTML = subjects.map(s => `<option value="${s}">${s}</option>`).join('');
}

async function loadGrades() {
  loadedGradeData = await api('getGrades', { year: '2568', classroom: document.getElementById('gradeClassroom').value, subject: document.getElementById('gradeSubject').value });
  document.getElementById('gradeTbody').innerHTML = loadedGradeData.map((s,i) => `
    <tr data-sid="${s.studentId}"><td>${i+1}</td><td>${s.studentId}</td><td>${s.name}</td><td></td>
    <td><input type="number" class="score-input s1" value="${s.grades.score1||''}"></td>
    <td><input type="number" class="score-input s2" value="${s.grades.score2||''}"></td>
    <td><input type="number" class="score-input s3" value="${s.grades.score3||''}"></td>
    <td>${s.grades.total||''}</td></tr>
  `).join('');
}

async function saveGrades() {
  const records = [];
  document.querySelectorAll('#gradeTbody tr[data-sid]').forEach(tr => {
    records.push({ studentId: tr.dataset.sid, score1: tr.querySelector('.s1').value, score2: tr.querySelector('.s2').value, score3: tr.querySelector('.s3').value });
  });
  await api('saveGrades', { year: '2568', classroom: document.getElementById('gradeClassroom').value, subject: document.getElementById('gradeSubject').value, gradeRecords: records });
  alert('บันทึกสำเร็จ');
}

function logout() { location.reload(); }
</script>
</body>
</html>
