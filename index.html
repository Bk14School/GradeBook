<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบบันทึกคะแนน - โรงเรียนบ้านคลอง 14</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root {
  --primary: #6366f1;
  --pl: #e0e7ff;
  --pd: #4338ca;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --bg: #f1f5f9;
  --card: #fff;
  --text: #1e293b;
  --muted: #64748b;
  --border: #e2e8f0;
  --sh: 0 2px 16px rgba(0,0,0,.06);
  --r: 16px;
  --t1: #1d4ed8; --t1b: #1e3a8a; --t1s: #2563eb; --t1c: #dbeafe;
  --t2: #0e7490; --t2b: #155e75; --t2s: #0891b2; --t2c: #cffafe;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);margin:0;}

/* NAV */
.nav{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;}
.nav-i{max-width:1500px;margin:0 auto;padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--pd);font-size:.95rem;}
.brand-ic{width:32px;height:32px;background:linear-gradient(135deg,var(--primary),var(--pd));border-radius:8px;color:#fff;font-weight:900;font-size:.82rem;display:flex;align-items:center;justify-content:center;letter-spacing:-1px;flex-shrink:0;}
.nav-r{display:flex;align-items:center;gap:6px;}
.tag{background:var(--pl);color:var(--pd);padding:4px 11px;border-radius:50px;font-size:.78rem;font-weight:700;display:none;}
.nbtn{background:#fff;border:1.5px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:50px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;min-height:34px;}
.nbtn:hover{border-color:var(--primary);color:var(--primary);background:var(--pl);}
.nbtn.red{color:var(--danger);border-color:#fecaca;}
.nbtn.red:hover{background:#fff1f2;}

/* PAGES */
.pg{display:none;}
.pg.on{display:block;animation:pgIn .2s ease;}
@keyframes pgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.wrap{max-width:1500px;margin:0 auto;padding:16px 12px;}

/* CARD */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin-bottom:12px;border:1px solid #f8fafc;}

/* LOGIN */
.login-shell{min-height:calc(100vh - 54px);display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ede9fe 0%,#f8fafc 55%,#dbeafe 100%);padding:16px;}
.login-box{background:#fff;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.1);padding:38px 30px;width:100%;max-width:340px;text-align:center;}
.login-ic{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--pd));margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.6rem;font-weight:900;}
.dots{display:flex;justify-content:center;gap:12px;margin-bottom:20px;}
.dot{width:13px;height:13px;border-radius:50%;background:#e2e8f0;transition:all .18s;}
.dot.on{background:var(--primary);transform:scale(1.35);}
.dot.err{background:var(--danger);}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:204px;margin:0 auto;}
.pkey{aspect-ratio:1;border-radius:12px;border:2px solid #e2e8f0;background:#f8fafc;font-size:1.4rem;font-weight:800;color:#334155;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;transition:all .12s;font-family:inherit;min-height:56px;}
.pkey:active{transform:scale(.9);background:var(--pl);color:var(--primary);}
.pkey.fn{font-size:.95rem;background:#f1f5f9;color:#64748b;}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:9000;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.modal-box{background:#fff;width:95%;max-width:510px;border-radius:var(--r);padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.15);max-height:90vh;overflow-y:auto;}
.badge-item{display:inline-flex;align-items:center;gap:5px;background:var(--pl);color:var(--pd);border:1px solid #c7d2fe;border-radius:50px;padding:3px 11px;font-size:.78rem;font-weight:700;margin:2px;}
.badge-item button{background:none;border:none;color:#ef4444;cursor:pointer;font-size:.95rem;padding:0;line-height:1;}

/* ADMIN */
.adm-table{width:100%;border-collapse:collapse;font-size:.86rem;}
.adm-table th{background:#1e293b;color:#fff;padding:9px 11px;text-align:left;}
.adm-table td{padding:8px 11px;border-bottom:1px solid var(--border);vertical-align:middle;}

/* SELECTOR BAR */
.sel-bar{background:#f8fafc;border:1px solid var(--border);border-radius:11px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
.sg label{display:block;font-size:.7rem;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.sg input,.sg select{font-family:inherit;border:1.5px solid var(--border);border-radius:7px;padding:6px 9px;font-size:.86rem;background:#fff;min-height:38px;}
.sg input:focus,.sg select:focus{outline:none;border-color:var(--primary);}

/* =====================================================
   ACCORDION CONFIG
   ===================================================== */
.acc{border-radius:12px;overflow:hidden;margin-bottom:12px;}

/* Accordion trigger row */
.acc-hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px;cursor:pointer;user-select:none;
  transition:background .15s;gap:10px;
  min-height:52px;   /* touch target */
}
.acc-hd:active{filter:brightness(.97);}

/* สัดส่วน — amber tone */
.acc-main .acc-hd{background:#fffbeb;border:1.5px solid #fde68a;}
.acc-main.open .acc-hd{border-bottom-color:transparent;border-radius:12px 12px 0 0;}
.acc-main .acc-body{background:#fffbeb;border:1.5px solid #fde68a;border-top:none;border-radius:0 0 12px 12px;}

/* หัวข้อย่อย — violet tone */
.acc-sub .acc-hd{background:#f5f3ff;border:1.5px solid #ddd6fe;}
.acc-sub.open .acc-hd{border-bottom-color:transparent;border-radius:12px 12px 0 0;}
.acc-sub .acc-body{background:#f5f3ff;border:1.5px solid #ddd6fe;border-top:none;border-radius:0 0 12px 12px;}

/* closed = no radius on body needed */
.acc-main:not(.open) .acc-hd{border-radius:12px;}
.acc-sub:not(.open)  .acc-hd{border-radius:12px;}

.acc-title{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem;}
.acc-arrow{font-size:.75rem;transition:transform .22s;display:inline-block;color:var(--muted);flex-shrink:0;}
.acc.open .acc-arrow{transform:rotate(180deg);}

/* Summary chips — shown when collapsed */
.acc-summary{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;}
.chip{display:inline-flex;align-items:center;background:rgba(0,0,0,.06);border-radius:50px;padding:2px 9px;font-size:.74rem;font-weight:600;color:var(--muted);white-space:nowrap;}
.chip.t1{background:#dbeafe;color:#1e40af;}
.chip.t2{background:#cffafe;color:#155e75;}
.chip.sub{background:#ede9fe;color:#5b21b6;}

/* Accordion body */
.acc-body{padding:14px 16px;transition:none;}
.acc-body.hidden{display:none;}

/* ---- Config inside accordion ---- */
.cfg-row{display:flex;flex-wrap:wrap;gap:16px;}
.cfg-block{display:flex;flex-direction:column;gap:5px;}
.cfg-ttl{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);}
.cfg-inline{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.cfg-lbl{font-size:.8rem;color:var(--muted);}
.cfg-n{width:60px;text-align:center;font-weight:700;padding:6px 3px;border:1.5px solid var(--border);border-radius:7px;font-size:.92rem;font-family:inherit;min-height:38px;}
.cfg-n:focus{outline:none;border-color:var(--primary);}
.cfg-n::-webkit-outer-spin-button,.cfg-n::-webkit-inner-spin-button{-webkit-appearance:none;}

/* term tabs */
.ttabs{display:flex;background:#f1f5f9;border-radius:9px;padding:3px;}
.ttab{padding:6px 15px;border-radius:7px;border:none;background:transparent;font-weight:700;font-size:.82rem;color:var(--muted);cursor:pointer;font-family:inherit;transition:all .15s;min-height:36px;}
.ttab.on{background:#fff;color:var(--primary);box-shadow:0 2px 6px rgba(0,0,0,.08);}

/* sub-item list */
.sub-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
.sub-row{
  display:flex;align-items:center;gap:7px;
  background:#fff;border:1.5px solid #ede9fe;
  border-radius:10px;padding:9px 12px;
  transition:border-color .15s;
}
.sub-row:hover{border-color:#a78bfa;}
.sub-n{font-size:.76rem;color:#a78bfa;font-weight:800;min-width:18px;}
.sub-name{
  flex:1;border:none;border-bottom:1.5px solid #e2e8f0;
  background:transparent;font-size:.88rem;padding:3px 4px;font-family:inherit;color:var(--text);
  min-height:36px;
}
.sub-name:focus{outline:none;border-bottom-color:#7c3aed;}
.sub-max-lbl{font-size:.76rem;color:#a78bfa;white-space:nowrap;}
.sub-max{
  width:56px;text-align:center;font-weight:700;
  border:1.5px solid #ddd6fe;border-radius:6px;
  padding:5px 4px;font-size:.88rem;font-family:inherit;
  color:#5b21b6;background:#faf5ff;min-height:36px;
}
.sub-max:focus{outline:none;border-color:#7c3aed;}
.sub-max::-webkit-outer-spin-button,.sub-max::-webkit-inner-spin-button{-webkit-appearance:none;}
.btn-rm{
  background:#fee2e2;color:#ef4444;border:none;
  border-radius:7px;width:34px;height:34px;
  cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.btn-rm:hover{background:#ef4444;color:#fff;}

.btn-add-sub{
  width:100%;padding:10px;background:transparent;color:#7c3aed;
  border:2px dashed #c4b5fd;border-radius:9px;font-family:inherit;
  font-weight:700;font-size:.85rem;cursor:pointer;transition:all .15s;
  min-height:44px;
}
.btn-add-sub:hover{background:#ede9fe;}

.raw-preview{
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  font-size:.78rem;color:var(--muted);margin-top:8px;
  background:#fff;border:1px solid #ede9fe;border-radius:8px;padding:7px 11px;
}
.raw-preview strong{color:#5b21b6;}
.raw-preview .res{color:#4c1d95;font-weight:800;}
.fml{font-family:monospace;font-size:.72rem;background:#1e293b;color:#7dd3fc;padding:2px 8px;border-radius:5px;}

/* BUTTONS */
.btn-pri{background:linear-gradient(135deg,var(--primary),var(--pd));color:#fff;border:none;padding:9px 20px;border-radius:8px;font-size:.88rem;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit;min-height:40px;}
.btn-pri:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(99,102,241,.35);}
.btn-save{background:linear-gradient(135deg,var(--success),#059669);color:#fff;border:none;padding:9px 20px;border-radius:8px;font-size:.88rem;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit;min-height:40px;}
.btn-save:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(16,185,129,.35);}
.btn-apply{background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:.88rem;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit;width:100%;margin-top:10px;min-height:44px;}
.btn-apply:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(124,58,237,.35);}
.btn-sm{padding:5px 12px;border-radius:7px;font-size:.78rem;font-weight:600;border:1.5px solid var(--border);background:#fff;cursor:pointer;font-family:inherit;min-height:34px;}

/* =====================================================
   GRADE TABLE
   ===================================================== */
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border);}
.gtbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.84rem;min-width:580px;}
.gtbl th{padding:8px 8px;text-align:center;border-right:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,255,255,.12);white-space:nowrap;color:#fff;}
.gtbl td{padding:6px 7px;text-align:center;border-right:1px solid var(--border);border-bottom:1px solid var(--border);vertical-align:middle;}
.gtbl tbody tr:hover td{background:#f8fafc!important;}

/* ── Sticky header rows ── */
.gtbl thead tr:first-child th { position:sticky; top:0; z-index:30; }
.gtbl thead tr:last-child  th { position:sticky; top:37px; z-index:30; }

/* ── Sticky columns: ที่(col0)=0  รหัส(col1)=36px  ชื่อ(col2)=108px ──  */
.gtbl thead th.s-c0 { left:0;    z-index:50; }
.gtbl thead th.s-c1 { left:36px; z-index:50; }
.gtbl thead th.s-c2 { left:108px;z-index:50; }

.gtbl tbody td.s-c0 { position:sticky; left:0;    z-index:10; background:#1e293b; color:#94a3b8; font-size:.78rem; }
.gtbl tbody td.s-c1 { position:sticky; left:36px; z-index:10; background:#1e293b; color:#94a3b8; font-size:.74rem; }
.gtbl tbody td.s-c2 { position:sticky; left:108px;z-index:10; background:#fff;    text-align:left; font-weight:500; min-width:145px; }

/* เส้น + เงาหลังคอลัมน์ชื่อ เพื่อแยกส่วนที่ตรึงออกจาก scroll content */
.gtbl thead th.s-c2,
.gtbl tbody td.s-c2 {
  border-right: 2px solid #6366f1 !important;
  box-shadow: 3px 0 8px rgba(99,102,241,.15);
}

/* row hover — คง bg ของ sticky cols ไว้ */
.gtbl tbody tr:hover td.s-c0 { background:#334155 !important; }
.gtbl tbody tr:hover td.s-c1 { background:#334155 !important; }
.gtbl tbody tr:hover td.s-c2 { background:#f0f4ff !important; }

.th-base{background:#1e293b;}
.th-att{background:#334155;}
.th-t1s{background:var(--t1s);}
.th-t1si{background:#3b82f6;font-size:.74rem!important;}
.th-t1raw{background:#1e40af;font-size:.74rem!important;}
.th-t1sc{background:var(--t1b);}
.th-t1e{background:var(--t1s);}
.th-t1t{background:var(--t1);}
.th-t2s{background:var(--t2s);}
.th-t2si{background:#22d3ee;color:#0f172a!important;font-size:.74rem!important;}
.th-t2raw{background:var(--t2b);font-size:.74rem!important;}
.th-t2sc{background:var(--t2b);}
.th-t2e{background:var(--t2s);}
.th-t2t{background:var(--t2);}
.th-grand{background:#0f172a;}

/* Toggle button in th */
.tbtn{
  display:inline-flex;align-items:center;gap:3px;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);
  color:#fff;border-radius:5px;padding:3px 8px;
  font-size:.7rem;font-weight:800;font-family:inherit;
  cursor:pointer;transition:background .15s;white-space:nowrap;margin-top:3px;
  min-height:26px;
}
.tbtn:hover{background:rgba(255,255,255,.32);}
.tbtn .arr{display:inline-block;transition:transform .2s;font-size:.64rem;}

/* CSS toggle — no DOM change */
.gtbl.t1-collapsed .sc1{display:none;}
.gtbl.t2-collapsed .sc2{display:none;}
.gtbl.t1-collapsed #tbtn1 .arr{transform:rotate(-90deg);}
.gtbl.t2-collapsed #tbtn2 .arr{transform:rotate(-90deg);}

.td-sub1{background:#eff6ff;}
.td-raw1{background:#dbeafe;font-weight:700;color:#1e40af;}
.td-sc1{background:#bfdbfe;font-weight:800;color:#1e3a8a;font-size:.92rem;}
.td-sub2{background:#ecfeff;}
.td-raw2{background:#cffafe;font-weight:700;color:#0e7490;}
.td-sc2{background:#a5f3fc;font-weight:800;color:#164e63;font-size:.92rem;}

.sinput{width:54px;text-align:center;font-weight:700;padding:5px 2px;border:1.5px solid #bfdbfe;border-radius:6px;font-size:.84rem;font-family:inherit;background:#fff;transition:all .13s;min-height:36px;}
.sinput:focus{outline:none;border-color:var(--primary);background:#eff6ff;transform:scale(1.05);}
.sinput.t2{border-color:#a5f3fc;color:#0e7490;}
.sinput.t2:focus{border-color:var(--t2s);background:#ecfeff;}
.sinput::-webkit-outer-spin-button,.sinput::-webkit-inner-spin-button{-webkit-appearance:none;}

.tbadge{display:inline-block;font-weight:700;padding:3px 8px;border-radius:6px;min-width:40px;font-size:.86rem;}
.tbadge.ok{background:#dcfce7;color:#166534;}
.tbadge.fail{background:#fee2e2;color:#991b1b;}
.tbadge.nil{background:#f1f5f9;color:#94a3b8;font-weight:500;}
.gbadge{display:inline-block;font-weight:900;padding:4px 10px;border-radius:7px;min-width:46px;font-size:.9rem;}
.gbadge.ok{background:#bbf7d0;color:#14532d;}
.gbadge.fail{background:#fecaca;color:#7f1d1d;}
.gbadge.nil{background:#e2e8f0;color:#94a3b8;font-weight:500;}

.sp{display:inline-block;border-radius:50px;padding:1px 6px;font-size:.68rem;font-weight:700;}
.sp.p{background:#dcfce7;color:#166534;}
.sp.a{background:#fee2e2;color:#991b1b;}
.sp.l{background:#fef3c7;color:#92400e;}

/* PROGRESS */
#pgov{display:none;position:fixed;inset:0;background:rgba(255,255,255,.82);backdrop-filter:blur(5px);z-index:9900;justify-content:center;align-items:center;}
.pgbox{background:#fff;border-radius:var(--r);padding:28px 40px;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.1);}
.spin{width:40px;height:40px;border:4px solid var(--pl);border-top-color:var(--primary);border-radius:50%;animation:spin .75s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
.tshelf{position:fixed;bottom:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:5px;pointer-events:none;}
.tst{padding:10px 15px;border-radius:9px;font-size:.82rem;font-weight:700;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.12);animation:tIn .22s ease;}
.tst.success{background:var(--success);}
.tst.error{background:var(--danger);}
.tst.warning{background:var(--warning);color:#1e293b;}
@keyframes tIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}

/* RESPONSIVE */
@media(max-width:600px){
  .sub-row{flex-wrap:wrap;gap:6px;}
  .sub-name{width:100%;flex:none;}
  .nav-r .nbtn span{display:none;}
  .sel-bar{flex-direction:column;align-items:stretch;}
  .sg input,.sg select{width:100%;}
  .btn-apply{font-size:.92rem;}
  .acc-hd{padding:12px 14px;}
  .cfg-row{gap:12px;}
}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-i">
    <div class="brand"><div class="brand-ic">G+</div>ระบบบันทึกคะแนน</div>
    <div class="nav-r">
      <div class="tag" id="teacherTag">🎓</div>
      <button class="nbtn" id="btnAdmin" onclick="showPage('adminPage')" style="display:none;">⚙️ <span>แอดมิน</span></button>
      <button class="nbtn" id="btnGrade" onclick="showPage('gradePage')" style="display:none;">📝 <span>กรอกคะแนน</span></button>
      <button class="nbtn red" id="btnOut" onclick="logout()" style="display:none;">⏏ <span>ออก</span></button>
    </div>
  </div>
</div>

<div class="tshelf" id="tshelf"></div>
<div id="pgov"><div class="pgbox"><div class="spin"></div><p id="pgTxt" style="margin:0;font-weight:700;color:var(--pd);">กำลังโหลด...</p></div></div>

<!-- LOGIN -->
<div id="loginPage" class="pg on">
  <div class="login-shell">
    <div class="login-box">
      <div class="login-ic">G+</div>
      <h2 style="font-size:1.2rem;font-weight:800;margin-bottom:2px;">ระบบบันทึกคะแนน</h2>
      <p style="color:#94a3b8;font-size:.83rem;margin-bottom:20px;">โรงเรียนบ้านคลอง 14</p>
      <div class="dots" id="pinDots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      <div class="pinpad">
        <button class="pkey" onclick="ap('1')">1</button><button class="pkey" onclick="ap('2')">2</button><button class="pkey" onclick="ap('3')">3</button>
        <button class="pkey" onclick="ap('4')">4</button><button class="pkey" onclick="ap('5')">5</button><button class="pkey" onclick="ap('6')">6</button>
        <button class="pkey" onclick="ap('7')">7</button><button class="pkey" onclick="ap('8')">8</button><button class="pkey" onclick="ap('9')">9</button>
        <button class="pkey fn" onclick="cp()">C</button><button class="pkey" onclick="ap('0')">0</button>

<script>
// ─── 1. ตัวแปรส่วนกลาง (GLOBAL VARIABLES) ───
let IS_SEM_MODE = false; // โหมดมัธยม (รายภาคเรียน)
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx_-Q4T2dJUX6L7c3EEB-ODEtsxb0Plsu6RA_J8WBh_DTIPcV4-JCn-A0aLBXC6ARvN/exec";
const ALL_CLS = ["ป.1","ป.2","ป.3","ป.4","ป.5","ป.6","ม.1 เทอม 1","ม.1 เทอม 2","ม.2 เทอม 1","ม.2 เทอม 2","ม.3 เทอม 1","ม.3 เทอม 2"];

let CU = null, PIN = "", SUBS = {}, STUDENTS = [];
let SI = { 1: [], 2: [] }; // หัวข้อย่อยเทอม 1 และ 2
let EXP = { 1: true, 2: true };
let editTid = null, editAssigned = [];

// ─── 2. ฟังก์ชันพื้นฐาน (UTILS) ───
function toast(msg, type = 'success') {
  const d = document.createElement('div'); d.className = `tst ${type}`; d.textContent = msg;
  document.getElementById('tshelf').appendChild(d); setTimeout(() => d.remove(), 3000);
}
function pg(t) { document.getElementById('pgov').style.display = 'flex'; document.getElementById('pgTxt').textContent = t || 'กำลังโหลด...'; }
function pg_() { document.getElementById('pgov').style.display = 'none'; }
function showPage(id) { document.querySelectorAll('.pg').forEach(p => p.classList.remove('on')); document.getElementById(id).classList.add('on'); scrollTo(0, 0); }

async function api(action, data = {}) {
  const r = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action, data }) });
  const j = await r.json(); 
  if (j.status === 'error') throw new Error(j.message); 
  return j.data;
}

function getRawMax(t) { return SI[t].reduce((s, x) => s + (Number(x.max) || 0), 0); }
function scl(raw, rm, sm) { return rm > 0 ? Math.round(raw / rm * sm * 100) / 100 : 0; }

function toggleAcc(id) {
  const el = document.getElementById(id);
  const body = document.getElementById(id + 'Body');
  el.classList.toggle('open');
  body.classList.toggle('hidden');
}

// ─── 3. ระบบ LOGIN & LOGOUT ───
function updDots(err = false) {
  document.querySelectorAll('.dot').forEach((d, i) => { d.className = 'dot' + (err ? ' err' : (i < PIN.length ? ' on' : '')); });
}
function ap(n) { if (PIN.length < 4) { PIN += n; updDots(); if (PIN.length === 4) setTimeout(doLogin, 150); } }
function dp() { PIN = PIN.slice(0, -1); updDots(); }
function cp() { PIN = ""; updDots(); }

async function doLogin() {
  pg('กำลังโหลด...');
  try {
    const [u, subs] = await Promise.all([api('login', { password: PIN }), api('getAllSubjects')]);
    CU = u; SUBS = subs;
    document.getElementById('teacherTag').textContent = `🎓 ${CU.name}`;
    document.getElementById('teacherTag').style.display = 'flex';
    document.getElementById('btnGrade').style.display = 'inline-block';
    document.getElementById('btnOut').style.display = 'inline-block';
    if (CU.isAdmin) {
      document.getElementById('btnAdmin').style.display = 'inline-block';
      loadTeachers(); showPage('adminPage');
    } else {
      CU.mySubjects = CU.subjects ? CU.subjects.split(',') : [];
      const cls = [...new Set(CU.mySubjects.map(s => s.split('_')[0]).filter(Boolean))];
      const sel = document.getElementById('gClass');
      sel.innerHTML = cls.length ? cls.map(c => `<option>${c}</option>`).join('') : `<option value="">ไม่มีสิทธิ์</option>`;
      updateSubjDrop(); showPage('gradePage');
    }
    cp();
  } catch (e) { updDots(true); setTimeout(cp, 400); toast(e.message, 'error'); }
  pg_();
}

function logout() {
  CU = null; cp();
  ['teacherTag', 'btnAdmin', 'btnGrade', 'btnOut'].forEach(id => document.getElementById(id).style.display = 'none');
  showPage('loginPage');
}

// ─── 4. ระบบจัดการครู (ADMIN LOGIC) ───
async function loadTeachers() {
  pg('โหลดรายชื่อครู...');
  try {
    const ts = await api('getTeacherList');
    document.getElementById('tTbody').innerHTML = ts.map(t => {
      const [id, name, , cls, , subsStr = ''] = [...t, '']; if (cls === '*') return '';
      const tags = (subsStr ? subsStr.split(',') : []).map(s => { const [c, n] = s.split('_'); return `<span class="badge bg-primary bg-opacity-10 text-primary border border-primary me-1" style="font-size:.7rem;">${c}: ${n}</span>` }).join('');
      return `<tr><td><b>${name}</b><br><small class="text-muted">ประจำชั้น ${cls}</small></td><td>${tags || '-'}</td><td style="text-align:center;"><button class="btn-sm" onclick="openModal('${id}','${name}','${cls}','${subsStr}')">⚙️</button></td></tr>`;
    }).join('');
  } catch (e) { toast(e.message, 'error'); }
  pg_();
}

function openModal(id, name, cls, subsStr) {
  editTid = id; editAssigned = subsStr ? subsStr.split(',') : [];
  document.getElementById('modalName').textContent = name;
  const sel = document.getElementById('mClassSel');
  sel.innerHTML = ALL_CLS.map(c => `<option>${c}</option>`).join('');
  document.getElementById('subModal').style.display = 'flex';
  renderMCbs(); renderMAssigned();
}
function closeModal() { document.getElementById('subModal').style.display = 'none'; }

function renderMCbs() {
  const cls = document.getElementById('mClassSel').value;
  const subs = SUBS[cls] || [];
  document.getElementById('mCbs').innerHTML = subs.length ? subs.map(s => { const v = `${cls}_${s}`; return `<label class="border p-2 rounded bg-white" style="cursor:pointer;font-size:.8rem;"><input type="checkbox" value="${v}" ${editAssigned.includes(v) ? 'checked' : ''} onchange="toggleMSub(this)"> ${s}</label>` }).join('') : 'ไม่มีรายวิชา';
}
function toggleMSub(cb) { editAssigned = cb.checked ? [...new Set([...editAssigned, cb.value])] : editAssigned.filter(v => v !== cb.value); renderMAssigned(); }
function removeMSub(v) { editAssigned = editAssigned.filter(x => x !== v); renderMCbs(); renderMAssigned(); }
function renderMAssigned() {
  document.getElementById('mAssigned').innerHTML = editAssigned.length ? editAssigned.map(s => { const [c, n] = s.split('_'); return `<div class="badge-item">${c}: ${n} <button onclick="removeMSub('${s}')">×</button></div>` }).join('') : 'ยังไม่มีวิชา';
}
async function saveModal() {
  pg('บันทึก...');
  try { await api('saveTeacherAssignments', { teacherId: editTid, subjects: editAssigned.join(',') }); toast('✅ บันทึกสำเร็จ'); closeModal(); loadTeachers(); } 
  catch (e) { toast(e.message, 'error'); } pg_();
}
async function adminSetup() {
  const y = document.getElementById('setupYear').value;
  if (!confirm(`สร้างฐานข้อมูลปี ${y}?`)) return;
  pg(`กำลังสร้างปี ${y}...`);
  try { const msg = await api('setupGradeYear', { year: y }); toast(msg); } 
  catch (e) { toast(e.message, 'error'); } pg_();
}

// ─── 5. ระบบบันทึกเกรด (GRADE SYSTEM) ───
function updateSubjDrop() {
  const sel = document.getElementById('gSubj'), cls = document.getElementById('gClass').value;
  sel.innerHTML = '';
  if (CU.isAdmin) {
    (SUBS[cls] || []).forEach(s => sel.innerHTML += `<option>${s}</option>`);
  } else {
    const p = cls + '_', f = CU.mySubjects.filter(s => s.startsWith(p)).map(s => s.replace(p, ''));
    f.length ? f.forEach(s => sel.innerHTML += `<option>${s}</option>`) : (sel.innerHTML = '<option>-- ไม่พบวิชา --</option>');
  }
}

async function loadGrades() {
  const year = document.getElementById('gYear').value;
  const cls = document.getElementById('gClass').value;
  const subj = document.getElementById('gSubj').value;
  if (!subj || subj === "-- ไม่พบวิชา --") return toast('กรุณาเลือกวิชา', 'error');

  IS_SEM_MODE = cls.includes("เทอม");
  document.getElementById('lblClass').textContent = cls;
  document.getElementById('lblSubj').textContent = subj;
  pg('กำลังโหลดเกรดและวันมาเรียน...');

  try {
    const res = await api('getGrades', { year, classroom: cls, subject: subj });
    const config = res.config;
    document.getElementById('c_t1a').value = config.t1_acc;
    document.getElementById('c_t1e').value = config.t1_exam;
    document.getElementById('c_t2a').value = config.t2_acc;
    document.getElementById('c_t2e').value = config.t2_exam;

    // UI ปรับตามโหมด
    document.getElementById('lblT1').textContent = IS_SEM_MODE ? "สัดส่วนคะแนน (เก็บ/สอบ)" : "เทอม 1 (เก็บ/สอบ)";
    document.getElementById('blockT2').style.display = IS_SEM_MODE ? 'none' : 'block';
    document.getElementById('termTabs').style.display = IS_SEM_MODE ? 'none' : 'flex';

    SI[1] = config.subItems?.t1 || [];
    SI[2] = IS_SEM_MODE ? [] : (config.subItems?.t2 || []);
    renderSubList(1); renderSubList(2); onCfg();

    STUDENTS = res.students;
    document.getElementById('gradePanel').style.display = '';
    buildTable();
    
    // ปิด Accordion หลังโหลดสำเร็จ
    const acc = document.getElementById('accMain');
    if(acc.classList.contains('open')) toggleAcc('accMain');

    toast(`📂 โหมด${IS_SEM_MODE ? 'มัธยม (รายภาคเรียน)' : 'ประถม (รายปี)'}`);
  } catch (e) { toast(e.message, 'error'); }
  pg_();
}

function buildTable() { buildHead(); buildBody(); }

function buildHead() {
  const t1a = +document.getElementById('c_t1a').value, t1e = +document.getElementById('c_t1e').value;
  const t2a = +document.getElementById('c_t2a').value, t2e = +document.getElementById('c_t2e').value;
  const n1 = SI[1].length, n2 = SI[2].length, rm1 = getRawMax(1), rm2 = getRawMax(2);

  let r1 = `<th rowspan="2" class="s-c0">ที่</th><th rowspan="2" class="s-c1">รหัส</th><th rowspan="2" class="s-c2">ชื่อ-นามสกุล</th><th rowspan="2" style="width:110px;">มาเรียน</th>`;
  if (n1 > 0) r1 += `<th colspan="${n1 + 1}">📝 คะแนนย่อย</th>`;
  r1 += `<th rowspan="2">เก็บ<br><small>(${t1a})</small></th><th rowspan="2">สอบ<br><small>(${t1e})</small></th><th rowspan="2">รวม<br><small>(${IS_SEM_MODE ? '100' : '50'})</small></th>`;
  
  if (!IS_SEM_MODE) {
    if (n2 > 0) r1 += `<th colspan="${n2 + 1}">📝 เทอม 2</th>`;
    r1 += `<th>เก็บ ท.2</th><th>สอบ ท.2</th><th>รวม ท.2</th><th rowspan="2">รวมปี</th>`;
  }
  
  let r2 = '';
  SI[1].forEach(x => r2 += `<th style="font-size:10px; font-weight:400;">${x.name}<br>(${x.max})</th>`);
  if (n1 > 0) r2 += `<th style="background:#1e40af; font-size:10px;">Raw</th>`;
  
  if (!IS_SEM_MODE) {
    SI[2].forEach(x => r2 += `<th style="font-size:10px; font-weight:400;">${x.name}<br>(${x.max})</th>`);
    if (n2 > 0) r2 += `<th style="background:#155e75; font-size:10px;">Raw</th>`;
  }
  document.getElementById('gtHead').innerHTML = `<tr>${r1}</tr><tr>${r2}</tr>`;
}

function buildBody() {
  const t1a = +document.getElementById('c_t1a').value, t1eM = +document.getElementById('c_t1e').value;
  const t2a = +document.getElementById('c_t2a').value, t2eM = +document.getElementById('c_t2e').value;
  const rm1 = getRawMax(1), rm2 = getRawMax(2);

  document.getElementById('gtBody').innerHTML = STUDENTS.map((s, idx) => {
    const g = s.grades || {}, st = s.stats || { present: 0, absent: 0, leave: 0 };
    
    let t1rs = 0;
    const t1scHtml = SI[1].map((x, i) => { const v = (g.t1_sub || [])[i] ?? ''; t1rs += Number(v) || 0; return `<td><input type="number" class="sinput sub1" max="${x.max}" value="${v}" data-si="${i}" oninput="calcSub(this,1)"></td>`; }).join('');
    const t1sc_v = rm1 > 0 ? scl(t1rs, rm1, t1a) : (g.t1_acc ?? '');
    const t1t = (Number(t1sc_v) || 0) + (Number(g.t1_exam) || 0);

    const tc = (v) => v === 0 ? 'nil' : v < (IS_SEM_MODE ? 50 : 25) ? 'fail' : 'ok';

    let html = `<tr>
      <td class="s-c0">${idx + 1}</td><td class="s-c1">${s.studentId}</td>
      <td class="s-c2"><div style="display:flex;justify-content:space-between;align-items:center;"><span>${s.name}</span><button class="btn-sm" onclick="printReport('${s.studentId}','${s.name}')" style="border-color:#6366f1;color:#6366f1;font-size:10px;padding:1px 5px;font-weight:700;">🖨️ ปพ.6</button></div></td>
      <td><span class="sp p">ม ${st.present}</span> <span class="sp a">ข ${st.absent}</span> <span class="sp l">ล ${st.leave}</span></td>
      ${t1scHtml} ${SI[1].length > 0 ? `<td class="t1raw">${t1rs}</td>` : ''} <td class="t1sc">${t1sc_v || '-'}</td>
      <td><input type="number" class="sinput s-t1e" max="${t1eM}" value="${g.t1_exam || ''}" oninput="calcExam(this)"></td>
      <td><span class="tbadge ${tc(t1t)} t1tot">${t1t || '-'}</span></td>`;

    if (!IS_SEM_MODE) {
      let t2rs = 0;
      const t2scHtml = SI[2].map((x, i) => { const v = (g.t2_sub || [])[i] ?? ''; t2rs += Number(v) || 0; return `<td><input type="number" class="sinput sub2" max="${x.max}" value="${v}" data-si="${i}" oninput="calcSub(this,2)"></td>`; }).join('');
      const t2sc_v = rm2 > 0 ? scl(t2rs, rm2, t2a) : (g.t2_acc ?? '');
      const t2t = (Number(t2sc_v) || 0) + (Number(g.t2_exam) || 0);
      const gt = t1t + t2t;
      html += `${t2scHtml} ${SI[2].length > 0 ? `<td class="t2raw">${t2rs}</td>` : ''} <td class="t2sc">${t2sc_v || '-'}</td>
        <td><input type="number" class="sinput s-t2e" max="${t2eM}" value="${g.t2_exam || ''}" oninput="calcExam(this)"></td>
        <td><span class="tbadge ${tc(gt/2)} t2tot">${t2t || '-'}</span></td><td><span class="gbadge ${gt < 50 ? 'fail' : 'ok'} gtot">${gt || '-'}</span></td>`;
    }
    return html + `</tr>`;
  }).join('');
}

// ─── 6. ระบบประมวลผล PDF (TRIGGER) ───
async function printReport(sid, sname) {
  const year = document.getElementById('gYear').value;
  const cls = document.getElementById('gClass').value;
  pg(`กำลังสร้าง ปพ.6 ของ ${sname}...`);
  try {
    const pdfDataUri = await api('generateStudentPDF', { year, classroom: cls, studentId: sid });
    const link = document.createElement('a');
    link.href = pdfDataUri; link.download = `ปพ6_${sname}.pdf`; 
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    toast('สร้างไฟล์สำเร็จ ✓');
  } catch (e) { toast(e.message, 'error'); }
  pg_();
}

// ─── 7. ระบบคำนวณ & ตั้งค่า (CALC & CONFIG) ───
function switchTerm(t, btn) {
  document.querySelectorAll('.ttab').forEach(b => b.classList.remove('on')); btn.classList.add('on');
  document.getElementById('subPanel_1').style.display = t === 1 ? '' : 'none';
  document.getElementById('subPanel_2').style.display = t === 2 ? '' : 'none';
}
function addSub(t) { SI[t].push({ name: `หัวข้อ ${SI[t].length + 1}`, max: 10 }); renderSubList(t); }
function rmSub(t, i) { if (confirm('ลบหัวข้อนี้?')) { SI[t].splice(i, 1); renderSubList(t); onCfg(); } }
function renderSubList(t) {
  document.getElementById(`subList_${t}`).innerHTML = SI[t].map((x, i) => `
    <div class="sub-row">
      <span class="sub-n">${i + 1}.</span>
      <input class="sub-name" type="text" value="${x.name}" onchange="SI[${t}][${i}].name=this.value;">
      <span class="sub-max-lbl">เต็ม</span>
      <input class="sub-max" type="number" value="${x.max}" onchange="SI[${t}][${i}].max=Number(this.value);onCfg();">
      <button class="btn-rm" onclick="rmSub(${t},${i})">✕</button>
    </div>`).join('');
  onCfg();
}

function onCfg() { /* อัปเดตตัวเลข RawMax */ }

function applySubConfig() {
  const target = IS_SEM_MODE ? 100 : 50;
  const t1a = +document.getElementById('c_t1a').value, t1e = +document.getElementById('c_t1e').value;
  if (t1a + t1e !== target) return toast(`คะแนนรวมต้องได้ ${target}`, 'error');
  buildTable(); toast('อัปเดตตารางแล้ว');
}

function calcSub(el, t) {
  const mx = +el.getAttribute('max'); if (+el.value > mx) el.value = mx;
  const tr = el.closest('tr');
  let rs = 0; tr.querySelectorAll(t === 1 ? '.sub1' : '.sub2').forEach(i => rs += +i.value || 0);
  const rm = getRawMax(t), sm = +document.getElementById(`c_t${t}a`).value;
  const sc = scl(rs, rm, sm);
  tr.querySelector(t === 1 ? '.t1raw' : '.t2raw').textContent = rs;
  tr.querySelector(t === 1 ? '.t1sc' : '.t2sc').textContent = sc;
  recalcTots(tr);
}
function calcExam(el) { recalcTots(el.closest('tr')); }
function recalcTots(tr) {
  const t1s = +tr.querySelector('.t1sc')?.textContent || 0, t2s = +tr.querySelector('.t2sc')?.textContent || 0;
  const t1e = +tr.querySelector('.s-t1e')?.value || 0, t2e = +tr.querySelector('.s-t2e')?.value || 0;
  const t1t = t1s + t1e, t2t = t2s + t2e, gt = t1t + t2t;
  const tc = v => v === 0 ? 'nil' : v < (IS_SEM_MODE ? 50 : 25) ? 'fail' : 'ok';
  if (tr.querySelector('.t1tot')) { tr.querySelector('.t1tot').textContent = t1t; tr.querySelector('.t1tot').className = `tbadge ${tc(t1t)} t1tot`; }
  if (tr.querySelector('.gtot')) { tr.querySelector('.gtot').textContent = gt; tr.querySelector('.gtot').className = `gbadge ${gt < 50 ? 'fail' : 'ok'} gtot`; }
}

async function saveGrades() {
  const target = IS_SEM_MODE ? 100 : 50;
  const t1a = +document.getElementById('c_t1a').value, t1e = +document.getElementById('c_t1e').value;
  if (t1a + t1e !== target) return toast('คะแนนรวมไม่ถูกต้อง', 'error');

  const records = [];
  document.querySelectorAll('#gtBody tr[data-sid]').forEach(tr => {
    const sid = tr.getAttribute('data-sid');
    records.push({
      studentId: sid,
      t1_sub: [...tr.querySelectorAll('.sub1')].map(i => i.value),
      t1_acc: +tr.querySelector('.t1sc').textContent || 0,
      t1_exam: tr.querySelector('.s-t1e').value,
      t2_sub: [...tr.querySelectorAll('.sub2')].map(i => i.value),
      t2_acc: +tr.querySelector('.t2sc')?.textContent || 0,
      t2_exam: tr.querySelector('.s-t2e')?.value || ''
    });
  });

  pg('กำลังบันทึก...');
  try {
    const msg = await api('saveGrades', {
      year: document.getElementById('gYear').value,
      classroom: document.getElementById('gClass').value,
      subject: document.getElementById('gSubj').value,
      config: { t1_acc: t1a, t1_exam: t1e, t2_acc: 0, t2_exam: 0, subItems: { t1: SI[1], t2: SI[2] }, rawMax: { t1: getRawMax(1), t2: getRawMax(2) } },
      gradeRecords: records
    });
    toast('✅ ' + msg);
  } catch (e) { toast(e.message, 'error'); }
  pg_();
}

async function saveConfigOnly() {
  pg('กำลังบันทึกสัดส่วน...');
  try {
    await api('saveGrades', {
      year: document.getElementById('gYear').value,
      classroom: document.getElementById('gClass').value,
      subject: document.getElementById('gSubj').value,
      config: { t1_acc: +document.getElementById('c_t1a').value, t1_exam: +document.getElementById('c_t1e').value, subItems: { t1: SI[1], t2: SI[2] }, rawMax: { t1: getRawMax(1), t2: getRawMax(2) } },
      gradeRecords: []
    });
    toast('✅ บันทึกสัดส่วนแล้ว'); buildTable();
  } catch (e) { toast(e.message, 'error'); } pg_();
}

// ─── 8. การควบคุมคีย์บอร์ด (UX) ───
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    const cur = document.activeElement; if (!cur.classList.contains('sinput')) return;
    e.preventDefault();
    const trs = Array.from(document.querySelectorAll('tbody tr'));
    const idx = trs.indexOf(cur.closest('tr'));
    const nextIdx = e.key === 'ArrowUp' ? idx - 1 : idx + 1;
    if (nextIdx >= 0 && nextIdx < trs.length) {
      const colIdx = Array.from(cur.closest('tr').querySelectorAll('.sinput')).indexOf(cur);
      const target = trs[nextIdx].querySelectorAll('.sinput')[colIdx];
      if (target) { target.focus(); target.select(); }
    }
  }
});
</script>
